[project]
name = "aws-cost-watchdog"
version = "1.0.0"
description = "Finds AWS resources you're paying for but not using, and switches dev servers off at night."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
